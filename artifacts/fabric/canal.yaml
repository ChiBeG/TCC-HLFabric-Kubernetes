  adminOrdererOrganizations:
  - mspID: OrdererMSP
  adminPeerOrganizations:
  - mspID: Org1MSP
  - mspID: Org2MSP
  identities:
    OrdererMSP:
      secretName: ord-admin-tls
      secretKey: user.yaml
      secretNamespace: default
