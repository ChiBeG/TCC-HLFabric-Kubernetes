apiVersion: hlf.kungfusoftware.es/v1alpha1
kind: FabricPeer
metadata:
  creationTimestamp: null
  name: org2-peer0
  namespace: default
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - worker2
  couchDBexporter: null
  couchdb:
    externalCouchDB: null
    image: couchdb
    password: couchdb
    pullPolicy: ''
    tag: 3.1.1
    user: couchdb
  credentialStore: kubernetes
  deliveryClientaddressOverrides: null
  discovery:
    period: 60s
    touchPeriod: 60s
  dockerSocketPath: ''
  env: null
  external_chaincode_builder: false
  externalBuilders:
  - name: ccaas_builder
    path: /opt/hyperledger/ccaas_builder
    propagateEnvironment:
    - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG
  externalEndpoint: peer0-org2.localho.st:443
  fsServer: null
  gatewayApi:
    gatewayName: hlf-gateway
    gatewayNamespace: default
    port: 443
  gossip:
    aliveExpirationTimeout: ''
    aliveTimeInterval: ''
    bootstrap: ''
    endpoint: ''
    externalEndpoint: peer0-org2.localho.st:443
    orgLeader: true
    reconnectInterval: ''
    responseWaitTime: ''
    useLeaderElection: false
  grpcProxy: null
  hostAliases: null
  hosts:
  - peer0-org2.localho.st
  image: hyperledger/fabric-peer
  imagePullPolicy: Always
  imagePullSecrets: null
  istio:
    hosts:
    - peer0-org2.localho.st
    ingressGateway: ingressgateway
    port: 443
  logging:
    cauthdsl: info
    gossip: info
    grpc: info
    ledger: info
    level: info
    msp: info
    peer: info
    policies: info
  mspID: Org2MSP
  peerVolumeMounts: null
  podAnnotations: null
  podLabels: null
  replicas: 1
  resources:
    chaincode:
      limits:
        cpu: '1'
        memory: 100Mi
      requests:
        cpu: 10m
        memory: 10m
    couchdb:
      limits:
        cpu: '1'
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 10m
    couchdbExporter: null
    peer:
      limits:
        cpu: '1'
        memory: 512Mi
      requests:
        cpu: 10m
        memory: 128Mi
    proxy: null
  secret:
    enrollment:
      component:
        cahost: org2-ca.localho.st
        caname: ca
        caport: 443
        catls:
          cacert: 
          secretRef: null
        enrollid: peer
        enrollsecret: peerpw
        external: null
        vault: null
      tls:
        cahost: org2-ca.localho.st
        caname: tlsca
        caport: 443
        catls:
          cacert: 
          secretRef: null
        csr:
          cn: ''
          hosts:
          - 127.0.0.1
          - localhost
          - 192.168.56.10
          - 192.168.56.11
          - 192.168.56.12
          - org2-peer0
          - org2-peer0.default
          - peer0-org2.localho.st
        enrollid: peer
        enrollsecret: peerpw
        external: null
        vault: null
  service:
    type: ClusterIP
  serviceMonitor:
    enabled: true
    interval: 5s
    scrapeTimeout: 4s
    sampleLimit: 0
    labels:
      release: prometheus
  stateDb: leveldb
  storage:
    chaincode:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
    couchdb:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
    peer:
      accessMode: ReadWriteOnce
      size: 5Gi
      storageClass: local-path
  tag: 2.5.5
  tolerations: null
  traefik: null
  updateCertificateTime: null
  volumes: null
